name: Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit JavaScript dependencies
        run: |
          npm install --global pnpm@12.16.1
          pnpm audit --audit-level low
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file apps/server/Cargo.lock

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Runs for the same branch go one at a time, so `latest` always ends up on the newest commit.
    concurrency:
      group: docker-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # The source label links the published package to this repository.
        run: |
          docker build --tag hokan:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Test image
        run: bash scripts/test-docker.sh hokan:ci
      - name: Publish image
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag hokan:ci "$image:latest"
          docker tag hokan:ci "$image:sha-${GITHUB_SHA::7}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$image"
